name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build server mod
        run: dotnet build KappaTracker.csproj -c Release
        # Produces bin/Release/KappaTracker.zip (server mod only; client plugin
        # is skipped because SPT_ROOT is not set in CI).

      - name: Add client plugin to zip
        run: |
          mkdir -p _stage/BepInEx/plugins/KappaTracker
          cp ci-artifacts/KappaTracker.Client.dll _stage/BepInEx/plugins/KappaTracker/
          cd _stage && zip -ur ../bin/Release/KappaTracker.zip .

      - name: Extract release notes
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk "/^## \[$VERSION\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Scan DLLs with VirusTotal
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "VT_API_KEY not set, skipping scan"
            exit 0
          fi

          scan_file() {
            local FILE="$1"
            local NAME="$2"
            local SHA256
            SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              --url "https://www.virustotal.com/api/v3/files/$SHA256" \
              --header "x-apikey: $VT_API_KEY")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "  $NAME: uploading..." >&2
              RESPONSE=$(curl -s --request POST \
                --url https://www.virustotal.com/api/v3/files \
                --header "x-apikey: $VT_API_KEY" \
                --form "file=@$FILE")
              ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.data.id')
              for i in $(seq 1 15); do
                sleep 20
                STATUS=$(curl -s \
                  --url "https://www.virustotal.com/api/v3/analyses/$ANALYSIS_ID" \
                  --header "x-apikey: $VT_API_KEY" | jq -r '.data.attributes.status')
                echo "  $NAME: $STATUS ($i/15)" >&2
                [ "$STATUS" = "completed" ] && break
              done
            else
              echo "  $NAME: existing report found" >&2
            fi

            echo "https://www.virustotal.com/gui/file/$SHA256/detection"
          }

          SERVER_URL=$(scan_file \
            "bin/Release/SPT_Runtime/user/mods/KappaTracker/KappaTracker.dll" \
            "KappaTracker.dll")
          CLIENT_URL=$(scan_file \
            "ci-artifacts/KappaTracker.Client.dll" \
            "KappaTracker.Client.dll")

          printf '\n---\n\n**VirusTotal scans**\n' >> RELEASE_NOTES.md
          echo "- [KappaTracker.dll (server mod)]($SERVER_URL)" >> RELEASE_NOTES.md
          echo "- [KappaTracker.Client.dll (client plugin)]($CLIENT_URL)" >> RELEASE_NOTES.md

      - name: Delete existing release if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq '.id' 2>/dev/null || true)
          if [ -n "$RELEASE_ID" ] && [ "$RELEASE_ID" != "null" ]; then
            gh api repos/${{ github.repository }}/releases/$RELEASE_ID -X DELETE
            echo "Deleted existing release $RELEASE_ID"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/Release/KappaTracker.zip
          body_path: RELEASE_NOTES.md
